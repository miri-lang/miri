# A rented Linux x86-64 virtual machine with dedicated vCPUs, whose numbers
# may be published only under the label "preliminary" (bench/CHARTER.md
# section 8). A VM exposes no frequency governor or turbo control, so this
# profile declares neither and is never checked for them; what it can give is
# a pinned core, inputs in memory, steal time read around every run, and a
# second session that reproduces the first.

name = "preliminary-vps"
publishable = true
label = "preliminary"
os = "linux"
arch = "x86_64"
# The core every benchmark process tree is pinned to. The VM has at least two
# vCPUs, so the pinned one has an idle neighbour for the runner itself.
pinned_core = 1
# Inputs are written here so the page cache never depends on run order: a
# tmpfs the run mounts, outside /dev, whose files Deno refuses to read with
# only --allow-read. Where it is absent the runner falls back to its own
# work directory.
input_dir = "/run/miri-bench"
# The exact machine, filled in when the run is made.
model = "recorded in env.json by the run"
# The coefficient of variation of the C reference's wall time on this VM
# (bench/machine/noise.py, pinned to the core above, the machine otherwise
# idle): nbody size s over 50 runs, and size m over 30. It is above the
# charter's statistics.noisy_cv, so a single run here says little; the
# numbers rest on medians, the re-runs of noisy cells and the second session
# that must reproduce the first.
measured_noise_cv = "0.108 (nbody s, 50 runs); 0.123 (nbody m, 30 runs)"

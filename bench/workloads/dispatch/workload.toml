# The dispatch workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "dispatch"
# The compiler mechanisms the workload stresses.
tags = ["dispatch", "struct-method", "float", "loop"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "At size S the cold time is mostly process start-up, not the kernel; read the hot time for this workload at size S.",
]
parameter = "How many times the shapes' areas are summed."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 3000
checksum = "73294500"

[sizes.m]
parameter = 30000
checksum = "732945000"

[sizes.l]
parameter = 180000
checksum = "4397670000"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Loads each shape's kind and then its function table before the indirect call."
cpp = "One virtual call through the vtable per shape."
rust = "One dynamic call through the trait object's vtable per shape."
go = "One interface method call through the itab per shape."
python = "A dynamic method lookup and call per shape in the interpreter."
typescript = "A polymorphic inline cache over the shape classes."
miri = "Ahead of C: the loop reads each shape without reference-count traffic, and the inliner removes calls whose target it can see."

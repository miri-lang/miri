# The fannkuch-redux workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads the parameter from the file
# named by its first argument.

name = "fannkuch-redux"
# The compiler mechanisms the workload stresses.
tags = ["int", "array-index", "loop"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "At size S the cold time is mostly process start-up ; read the hot time for this workload at size S.",
    "C and C++ index without bounds checks by language; Miri, Rust, Go, Python and TypeScript check every index, and the ratio includes that cost (charter section 4).",
]
parameter = "The number of elements permuted."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# The work grows by a factor of n per step, so no whole parameter lands near
# every target: on the dev profile 9 runs in about a third of the S target and
# 11 in about two thirds of the L target.

[sizes.s]
parameter = 9
checksum = "8629 30"

[sizes.m]
parameter = 10
checksum = "73196 38"

[sizes.l]
parameter = 11
checksum = "556355 51"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Integer loops over a small array, unchecked."
cpp = "The same integer loops as C."
rust = "The same loops with bounds checks the optimiser mostly removes."
go = "The same loops with bounds checks."
python = "The permutation loops run in the interpreter."
typescript = "V8 compiles the integer loops to machine code close to C's."
miri = "Every array access keeps a bounds check the optimiser cannot hoist because the loop bound is a parameter, and the counters are overflow-checked."

# The sieve workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads the parameter from the file
# named by its first argument.

name = "sieve"
# The compiler mechanisms the workload stresses.
tags = ["int", "array-index", "loop"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "C and C++ index without bounds checks by language; Miri, Rust, Go, Python and TypeScript check every index, and the ratio includes that cost (charter section 4).",
]
parameter = "The largest number sieved."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# The sieve holds one flag per number, so the L target would need billions of
# them; L is capped at 300 million flags, about a third of its target on the
# dev profile, which keeps every port's memory within a workstation's.

[sizes.s]
parameter = 14000000
checksum = "910077 376672951"

[sizes.m]
parameter = 140000000
checksum = "7912199 401748214"

[sizes.l]
parameter = 300000000
checksum = "16252325 755721940"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "One flag per byte, written with unchecked strided stores."
cpp = "The same as C."
rust = "The same flags with a bounds check on every strided write."
go = "The same loop with bounds checks; it runs slightly faster than C and the reason is not explained (measured: not a page-fault effect, the hot run takes no more page faults than the cold one)."
python = "The marking loop runs in the interpreter over a list of objects."
typescript = "A plain array of booleans, filled up front and written by compiled V8 code, at more bytes per flag than C."
miri = "A bounds check on every strided write, like Rust; memory matches C."

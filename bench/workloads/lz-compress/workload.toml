# The lz-compress workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "lz-compress"
# The compiler mechanisms the workload stresses.
tags = ["u8", "array-index", "int", "loop"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "C and C++ index without bounds checks by language; Miri, Rust, Go, Python and TypeScript check every index, and the ratio includes that cost (charter section 4).",
]
parameter = "How many bytes are generated and compressed."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 250000
checksum = "40588 18331 235518976"

[sizes.m]
parameter = 2500000
checksum = "407755 183044 500456907"

[sizes.l]
parameter = 15000000
checksum = "2452786 1095858 355206530"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "A byte-compare scan with unchecked reads."
cpp = "The same unchecked scan as C."
rust = "The same scan; the optimiser removes most bounds checks."
go = "The same scan with bounds checks on every read."
python = "The byte loop runs in the interpreter."
typescript = "Typed-array reads compiled by V8, with bounds checks."
miri = "Two bounds-checked list reads per compared byte; the checks stay in the loop because its bound is a parameter."

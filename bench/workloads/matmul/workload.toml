# The matmul workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads the parameter from the file
# named by its first argument.

name = "matmul"
# The compiler mechanisms the workload stresses.
tags = ["float", "array-index", "loop"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "C's lead over Rust here is bounds checking, not vectorisation: on x86-64 the C port runs as fast with clang's vectorisers off, and the Rust port with unchecked indexing runs at C's speed. C and C++ index without bounds checks by language; Miri, Rust, Go, Python and TypeScript check every index, and the ratio includes that cost (charter section 4).",
]
parameter = "The side of the square matrices."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 310
checksum = "692640750"

[sizes.m]
parameter = 670
checksum = "6992739750"

[sizes.l]
parameter = 1230
checksum = "43265157750"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "A strict floating-point inner product over row pointers, with unchecked reads."
cpp = "The same loop as C."
rust = "The same loop with a bounds check on every read; measured, this is Rust's whole distance from C here, since Rust with unchecked indexing runs at C's speed and C gains nothing from its vectorisers."
go = "The same loop with bounds checks."
python = "The inner product runs in the interpreter over boxed floats."
typescript = "Nested arrays with a shape check and a bounds check per read."
miri = "A bounds check per read like Rust, plus the inner row's header reloaded on every read and a check the optimiser cannot hoist because the bound is a parameter."

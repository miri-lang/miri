# The generics workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "generics"
# The compiler mechanisms the workload stresses.
tags = ["generic", "list", "alloc"]
parameter = "How many values go onto each stack."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# Every port holds three stacks of this many values at once, so L is capped at
# 25 million to stay within a workstation's memory.

[sizes.s]
parameter = 1600000
checksum = "451175042 39600000 933571918"

[sizes.m]
parameter = 16000000
checksum = "267882272 396000000 198074950"

[sizes.l]
parameter = 25000000
checksum = "566349453 618750000 169889594"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Writes the container once per element type by hand, with nothing generic left at run time."
cpp = "Templates are instantiated per type and inlined."
rust = "Generics are monomorphised per type and inlined."
go = "Generic code is compiled once per memory shape, with a dictionary lookup for some operations."
python = "Every value is a heap object and every call is dynamic."
typescript = "Each pair is a heap object and calls go through inline caches."
miri = "Memory matches C; the time goes to optional values and pairs returned through a memory slot instead of registers, and to the generic class body shared across element types."

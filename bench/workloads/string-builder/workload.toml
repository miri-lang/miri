# The string-builder workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "string-builder"
# The compiler mechanisms the workload stresses.
tags = ["string", "cow", "alloc"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "The C port formats every piece with snprintf, the idiomatic C call, and that call is nearly all of C's time; C++ and Rust format integers directly, so C is not the fastest reference on this workload.",
]
parameter = "How many pieces are appended."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 400000
checksum = "4221690 992338580"

[sizes.m]
parameter = 4000000
checksum = "46216890 656651736"

[sizes.l]
parameter = 25000000
checksum = "309688890 630331041"

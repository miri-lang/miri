# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Parses each field in place with strtoll and strtod and counts with the suite's shared chained hash table (see the port notes)."
cpp = "Walks the lines in place with one reused field vector; each number is converted through a temporary string."
rust = "Splits lazily, parses from borrowed slices, and hashes each key with SipHash."
go = "Splits every line into a fresh slice of strings before parsing."
python = "Splits and parses in the interpreter, with a new string object per field."
typescript = "Splits each line into new strings and converts them with Number."
miri = "Reads lines lazily and holds the input once, so peak memory is close to C, but every field is an owned string and every update probes the map twice."

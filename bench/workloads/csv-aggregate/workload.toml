# The csv-aggregate workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument: the text `../generate.py` writes for the parameter.

name = "csv-aggregate"
# The compiler mechanisms the workload stresses.
tags = ["string-split", "parse", "map", "string"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "The C port counts with the suite's shared chained hash table (bench/c/table.h), hashed with FNV-1a, the cheapest hash on the chart; every other port uses its standard map and that map's hash (Rust's is SipHash, slower per key and resistant to collision attacks).",
]
parameter = "How many records the generated file holds."
generated = true

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# L is set by the size of its input: 20 million records is a 400 MB file.


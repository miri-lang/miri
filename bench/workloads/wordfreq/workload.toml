# The wordfreq workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument: the text `../generate.py` writes for the parameter.

name = "wordfreq"
# The compiler mechanisms the workload stresses.
tags = ["string", "map", "sort", "alloc"]
parameter = "How many words the generated text holds."
generated = true

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# L is set by the size of its input: 50 million words is a 400 MB file, so it
# runs under its time target (about 1.2 s in C on the dev profile).

[sizes.s]
parameter = 2000000
checksum = "4982 uclhhnttfb=4204,frvxhojxat=3277,ppweqxd=3049,qruizgtj=2883,jtc=2787,kkhh=2772,nrqhzz=2726,ibgldiju=2623,bfetwrwvw=2571,iugxhkgtuo=2488"
input_sha256 = "5b29f23d2345d36ce3ef348b54e55a0307241ded1688bf271f514fc9c60e9d6a"


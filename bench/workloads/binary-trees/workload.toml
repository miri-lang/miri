# The binary-trees workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "binary-trees"
# The compiler mechanisms the workload stresses.
tags = ["alloc", "rc"]
parameter = "The depth of the largest tree."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# A complete tree of depth 20 already takes about 5 s in C while holding only
# about 65 MB, so this workload cannot meet both the L time target and a peak
# above 100 MB; L follows the time target.

[sizes.s]
parameter = 14
checksum = "65535 3123888 32767"

[sizes.m]
parameter = 17
checksum = "524287 29185376 262143"

[sizes.l]
parameter = 19
checksum = "2097151 133518688 1048575"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "One malloc and one free per node through the C library."
cpp = "The same allocation per node as C, plus a constructor and destructor call per node."
rust = "One Box allocation and one drop per node on the system allocator, close to C."
go = "The garbage collector traces the long-lived tree on every cycle, marking work the freeing languages do not have."
python = "Every node is a reference-counted heap object, and the tree check runs in the interpreter."
typescript = "V8 bump-allocates nodes in its young generation and discards dead trees wholesale instead of freeing each node: the textbook best case for a generational collector."
miri = "One reference-counted allocation per node from the runtime's block cache, close to Rust in time; each node carries a reference-count header C does not, so peak memory is higher."

# The closures workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "closures"
# The compiler mechanisms the workload stresses.
tags = ["closure", "list", "alloc", "int"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "The C port reuses its stage buffers across rounds, where every other port builds a fresh collection per stage, so C's time and memory carry no allocation for the stages.",
]
parameter = "How many numbers the pipelines run over."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# Every port holds the numbers and two stages' results at once, so L is capped
# at 20 million numbers to stay within a workstation's memory.

[sizes.s]
parameter = 1100000
checksum = "257539979"

[sizes.m]
parameter = 11000000
checksum = "575399776"

[sizes.l]
parameter = 20000000
checksum = "227999587"

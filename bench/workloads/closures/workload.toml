# The closures workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "closures"
# The compiler mechanisms the workload stresses.
tags = ["closure", "list", "alloc", "int"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "The C port reuses its stage buffers across rounds, where every other port builds a fresh collection per stage, so C's time and memory carry no allocation for the stages.",
]
parameter = "How many numbers the pipelines run over."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

# Every port holds the numbers and two stages' results at once, so L is capped
# at 20 million numbers to stay within a workstation's memory.

[sizes.s]
parameter = 1100000
checksum = "257539979"

[sizes.m]
parameter = 11000000
checksum = "575399776"

[sizes.l]
parameter = 20000000
checksum = "227999587"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Reuses its stage buffers across rounds (see the port notes) and calls no closures, so it allocates almost nothing."
cpp = "Builds a fresh vector per stage, with each lambda inlined into its loop."
rust = "Builds a fresh Vec per stage; the iterator adapters inline each closure."
go = "Grows each stage's slice from empty and calls every closure through a function value."
python = "Calls a Python function per element in the interpreter."
typescript = "The built-in map, filter and reduce call a JavaScript closure per element and allocate an array per stage."
miri = "map, filter and reduce call the lambda indirectly once per element where C++ and Rust inline it; memory matches C."

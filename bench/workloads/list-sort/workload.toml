# The list-sort workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "list-sort"
# The compiler mechanisms the workload stresses.
tags = ["list", "sort", "alloc"]
# What a reader needs beside this workload's ratios to read them fairly;
# the summary prints every note (charter section 3).
notes = [
    "The C port sorts with qsort and a comparator function the compiler cannot inline, which is idiomatic C; the C++ and Rust ports sort with inlined comparisons (std::sort, sort_by) and run several times faster than C here, so on this workload read Miri against Rust, not C.",
]
parameter = "How many numbers are generated and sorted."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true



[sizes.s]
parameter = 250000
checksum = "990360238 860404107"

[sizes.m]
parameter = 2500000
checksum = "819536973 399934053"

[sizes.l]
parameter = 15000000
checksum = "185633034 741520587"

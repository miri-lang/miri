# The mandelbrot workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads the parameter from the file
# named by its first argument.

name = "mandelbrot"
# The compiler mechanisms the workload stresses.
tags = ["float", "loop", "call"]
parameter = "The width and height of the grid, in points."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 800
checksum = "512148738 254099"

[sizes.m]
parameter = 2500
checksum = "386996177 2480929"

[sizes.l]
parameter = 6100
checksum = "182016586 14768878"

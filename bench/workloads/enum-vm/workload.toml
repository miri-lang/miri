# The enum-vm workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "enum-vm"
# The compiler mechanisms the workload stresses.
tags = ["enum-match", "int", "loop"]
parameter = "The loop count the interpreted program runs to."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 2000000
checksum = "50463547 27968760"

[sizes.m]
parameter = 20000000
checksum = "504635887 279687510"

[sizes.l]
parameter = 120000000
checksum = "27815740 1678125010"

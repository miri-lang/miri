# The ray-tracer workload's manifest: its parameter at each size and the checksum
# every port must print for it. Each port reads its input from the file named
# by its first argument, which holds the parameter.

name = "ray-tracer"
# The compiler mechanisms the workload stresses.
tags = ["float", "struct-method", "call", "loop"]
parameter = "The width and height of the image, in pixels."

# The parameters were set from the portable C build on the dev profile, not by
# a calibration run on the publication profile, so they are provisional.
provisional = true

[sizes.s]
parameter = 1250
checksum = "854447170 961056"

[sizes.m]
parameter = 4000
checksum = "677232387 9845408"

[sizes.l]
parameter = 9800
checksum = "215173033 59103498"

# Why each language lands where it does on this workload: one to three
# sentences per language, no figures (the summary prints them beside the
# numbers, which come only from a run).
[explain]
c = "Small vector structs kept in registers."
cpp = "The same as C."
rust = "The same as C, with bounds checks."
go = "Small vector structs passed and returned by value."
python = "Every vector is a heap object in the interpreter."
typescript = "Escape analysis removes some vector allocations, not all."
miri = "Vectors are returned through a memory slot instead of registers, so the one-line vector helpers cost a store and a load each."

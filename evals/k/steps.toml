# Read and repair the warnings a green test run left behind.
#
# `check` reports the unused binding as MER_TYP_071 and hands back a repair for
# it. `miri test` compiles the same file and carries the same warning in its
# envelope, against the test file's own line, so a loop that runs its tests and
# reads the answer learns what the edit left behind without a separate check,
# and applies the repair the warning carries.

[[step]]
type = "Check"
file = "suite.mi"
must_succeed = true
assert_diagnostic_code = "MER_TYP_071"

[[step]]
type = "TestDir"
dir = "."
format_json = true
must_succeed = true
assert_diagnostic_code = "MER_TYP_071"

[[step]]
type = "FixApply"
file = "suite.mi"
must_succeed = true
assert_file_changed = ["suite.mi"]

[[step]]
type = "TestDir"
dir = "."
format_json = true
must_succeed = true

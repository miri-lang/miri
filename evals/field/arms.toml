# The arms a job can be run under. A round names which ones it runs.
#
# The brief is one text with three substitutions. `language` and `toolchain`
# are the only sentences that differ between arms, and `entry_point` is the
# path the subject writes its program to. Everything else a subject reads is
# byte-identical across them.
#
# `run` is how the harness runs the finished program. The path of a hidden
# test's input is appended to it as one more argument. It is the way the arm's
# own toolchain runs a project, so a package the subject installed with that
# toolchain is there when the hidden tests run.
#
# `kernel_evidence` is how a GPU job tells a kernel from a loop on the
# processor that prints the same numbers: every pattern must match somewhere in
# the files the globs name, or the run is recorded `notOnGpu` and is not green.
# An arm with `onboarding` is taught Miri before its job arrives: the harness runs
# `onboarding/ONBOARDING.md` with the named materials first, unmeasured, then
# resumes that session with the job's brief. Its brief is measured from there,
# and the onboarding context stays in the conversation as cached input. The
# baselines and the two cold Miri arms are launched straight on the brief.
#
# A Miri kernel is a `gpu fn`, or a `forall` in the entry point that runs on the
# device — spelled `gpu forall`, or reading a `gpu let` / `gpu var` binding,
# since a bare `forall` over host data runs as a loop on the processor. So the
# source needs a `gpu` construct and something that runs: a `forall` or a
# `gpu fn`. A baseline's is a WGSL compute shader and a call that dispatches it.

[[arm]]
id = "miri-pack"
language = "Miri"
toolchain = "the `miri` compiler: `miri check`, `miri build`, `miri run` and `miri test`"
entry_point = "main.mi"
run = ["miri", "run", "main.mi", "--"]
install_pack = true
notes = "The release binary with the skill pack installed into the workspace."
kernel_evidence = { files = ["main.mi"], patterns = ['\bgpu\s+(fn|forall|let|var)\b', '\b(forall|gpu\s+fn)\b'] }

[[arm]]
id = "miri-bare"
language = "Miri"
toolchain = "the `miri` compiler: `miri check`, `miri build`, `miri run` and `miri test`"
entry_point = "main.mi"
run = ["miri", "run", "main.mi", "--"]
install_pack = false
notes = "The release binary and `miri --help`. No prose file of any kind."
kernel_evidence = { files = ["main.mi"], patterns = ['\bgpu\s+(fn|forall|let|var)\b', '\b(forall|gpu\s+fn)\b'] }

[[arm]]
id = "miri-skill"
language = "Miri"
toolchain = "the `miri` compiler: `miri check`, `miri build`, `miri run` and `miri test`"
entry_point = "main.mi"
run = ["miri", "run", "main.mi", "--"]
kernel_evidence = { files = ["main.mi"], patterns = ['\bgpu\s+(fn|forall|let|var)\b', '\b(forall|gpu\s+fn)\b'] }
install_pack = true
onboarding = ["skill"]
notes = "The release binary, onboarded from the skill pack before the brief."

[[arm]]
id = "miri-grammar"
language = "Miri"
toolchain = "the `miri` compiler: `miri check`, `miri build`, `miri run` and `miri test`"
entry_point = "main.mi"
run = ["miri", "run", "main.mi", "--"]
kernel_evidence = { files = ["main.mi"], patterns = ['\bgpu\s+(fn|forall|let|var)\b', '\b(forall|gpu\s+fn)\b'] }
install_pack = false
onboarding = ["grammar"]
notes = "The release binary, onboarded from the formal grammar before the brief: does a grammar stop guesses like `let x: int`?"

[[arm]]
id = "miri-both"
language = "Miri"
toolchain = "the `miri` compiler: `miri check`, `miri build`, `miri run` and `miri test`"
entry_point = "main.mi"
run = ["miri", "run", "main.mi", "--"]
kernel_evidence = { files = ["main.mi"], patterns = ['\bgpu\s+(fn|forall|let|var)\b', '\b(forall|gpu\s+fn)\b'] }
install_pack = true
onboarding = ["skill", "grammar"]
notes = "The release binary, onboarded from the skill pack and the grammar together."

[[arm]]
id = "python"
language = "Python"
toolchain = "`uv` and `pytest`"
entry_point = "main.py"
run = ["uv", "run", "--quiet", "python", "main.py"]
install_pack = false
notes = "A baseline language. Baselines get no skill file: their guidance is in the weights, and that asymmetry is the experiment."
kernel_evidence = { files = ["**/*.py", "**/*.wgsl"], patterns = ['@compute', '\bdispatch_workgroups\b'] }

[[arm]]
id = "rust"
language = "Rust"
toolchain = "`cargo` and `clippy`"
entry_point = "src/main.rs"
run = ["cargo", "run", "--quiet", "--release", "--"]
install_pack = false
notes = "A baseline language."
kernel_evidence = { files = ["src/**/*.rs", "**/*.wgsl"], patterns = ['@compute', '\bdispatch_workgroups\b'] }

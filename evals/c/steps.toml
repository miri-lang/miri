# Add a function and its test to an existing module.
#
# Both declarations are added through `miri patch --insert-fn`, in one call. The
# insert re-checks the edited program before anything reaches disk, which is why
# no separate `check` step follows it.
#
# This did not make the transcript cheaper by the numbers, and the comment says
# so rather than implying otherwise: `invocations` is unchanged because the
# patch call took the `check` call's place, `bytes_written` is unchanged because
# the same file ends up on disk, and `bytes_read` rose because the patch
# envelope echoes both inserted declarations back. What changed is that the loop
# no longer authors the whole file to add to it, which these columns do not
# measure. See `evals/README.md`.

[[step]]
type = "ViewOutline"
file = "program.mi"
format_json = false
must_succeed = true
assert_output_contains = ["double"]

[[step]]
type = "InsertFn"
file = "program.mi"
must_succeed = true
assert_file_changed = ["program.mi"]
assert_output_contains = ["\"fileWritten\": true"]
insert = [
  { name = "quadruple", body = "fn quadruple(x i32) i32\n    return double(x) + double(x)" },
  { name = "test_quadruple", body = "@test\nfn test_quadruple()\n    let result = quadruple(3)\n    assert_eq(result, 12)" },
]

[[step]]
type = "ViewFn"
file = "program.mi"
name = "quadruple"
format_json = false
must_succeed = true
assert_output_contains = ["double(x) + double(x)"]

[[step]]
type = "TestDir"
dir = "."
must_succeed = true
assert_output_contains = ["test_quadruple"]

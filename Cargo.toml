[package]
name = "miri"
version = "0.7.0-beta.5"
description = "A modern, GPU-first, statically-typed programming language"
repository = "https://github.com/miri-lang/miri"
edition = "2021"
# Every `tests/*.rs` would otherwise become its own test binary. `pipeline.rs`,
# `utils.rs` and `runtime_fns.rs` are modules of `tests/mod.rs`, so auto-discovery
# built three extra binaries that linked the whole compiler again — one of them
# carrying no tests at all, the other two re-running theirs a second time.
autotests = false

[features]
default = ["cranelift"]
cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-object",
    "dep:cranelift-native",
    "dep:target-lexicon",
]
llvm = ["dep:inkwell"]
browser-gpu-gate = []
# Enables the GPU-execution integration tests, which require a real GPU adapter.
# Off by default so the GPU-less CI lane skips them; the macos-14 hardware job
# builds with this feature to run them on a real GPU.
gpu_hardware = []

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
logos = "0.16.0"
regex = "1.13.1"
rustyline = "17.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
tempfile = "3.24.0"
thiserror = "2.0.17"
walkdir = "2.5.0"

# Cranelift backend (default)
cranelift-codegen = { version = "0.127.1", optional = true }
cranelift-frontend = { version = "0.127.1", optional = true }
cranelift-module = { version = "0.127.1", optional = true }
cranelift-object = { version = "0.127.1", optional = true }
cranelift-native = { version = "0.127.1", optional = true }
target-lexicon = { version = "0.13", optional = true }

# LLVM backend (optional, requires LLVM installation)
inkwell = { version = "0.7.1", features = ["llvm21-1"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1.3"
naga = { version = "29.0", features = ["wgsl-in", "spv-out", "hlsl-out"] }
# Cranelift builds only the host architecture's backend by default, so a test
# that compiles for another architecture gets "Support for this target is
# disabled" instead of an answer. The signature rules that differ between
# x86-64 and AArch64 — how a 128-bit scalar is handed over, above all — are
# then only ever exercised by whichever machine happens to run the suite. Naming
# both backends here keeps that difference under test everywhere; the feature
# rides on the test profile alone, so the shipped compiler still carries one.
cranelift-codegen = { version = "0.127.1", features = ["x86", "arm64"] }

# The single integration test binary. Every suite entry point names it
# (`cargo test --test mod`), so it is declared rather than discovered.
[[test]]
name = "mod"
path = "tests/mod.rs"

[profile.dev]
# Full DWARF dominated both the compiler rlib and the integration test binary,
# and rustc pays for it in memory before the linker pays for it on disk. Line
# tables keep RUST_BACKTRACE=1 pointing at real source lines, which is what the
# test harness actually reads.
debug = "line-tables-only"

[profile.dev.package."*"]
# The integration suite spawns the compiler once per test — thousands of full
# compile-link-execute cycles — and Cranelift does the bulk of the work in each
# one. Dependencies are built once and then reused, so optimising them costs
# nothing per iteration while making every spawned compile cheaper. Debug
# assertions go with it, for the `debug_assert!`s and overflow checks threaded
# through Cranelift's own lowering and register allocation. This does not touch
# Cranelift's IR verifier, which is a codegen setting that defaults to on and
# keeps running: it is what catches malformed IR coming out of this compiler.
opt-level = 3
debug-assertions = false
